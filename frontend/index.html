
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>X2 ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#006B5E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="X2 ERP">
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="/icon.svg">
    <link id="dynamic-apple-touch-icon" rel="apple-touch-icon" href="/icon.svg">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        let updatePending = false;
        function promptUpdate() {
          if (updatePending) return;
          updatePending = true;
          if (confirm('تحديث جديد متاح. أعد تحميل الصفحة؟')) {
            window.location.reload();
          } else {
            updatePending = false;
          }
        }
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated' && !navigator.serviceWorker.controller) {
                    promptUpdate();
                  }
                });
              }
            });
            if (reg.waiting) {
              promptUpdate();
            }
          });
        });
      }
    </script>
  </body>
</html>
